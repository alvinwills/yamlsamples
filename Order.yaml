                                          - Fufilled btn:
                                              Control: Button@0.0.45
                                              Properties:
                                                BasePaletteColor: =Color.Green
                                                OnSelect: |-
                                                  =// Step 1: Get order details
                                                  Set(varOrderedQty, varSelectedOrder.'Order Quantity');
                                                  Set(varProductName, varSelectedOrder.Product.ProductName); // Use name for comparison
                                                  Set(varOrderDate, varSelectedOrder.DateofOrder);

                                                  // Step 2: Find matching inventory record by product name
                                                  Set(
                                                      varInventoryRecord,
                                                      First(
                                                          Filter(
                                                              Inventories,
                                                              Product.ProductName = varProductName
                                                          )
                                                      )
                                                  );

                                                  // Step 3: Update or create inventory record
                                                  If(
                                                      !IsBlank(varInventoryRecord),
                                                      Patch(
                                                          Inventories,
                                                          varInventoryRecord,
                                                          {
                                                              'Available Quantity': varInventoryRecord.'Available Quantity' + varOrderedQty,
                                                              'Date and Time': varOrderDate
                                                          }
                                                      ),
                                                      Patch(
                                                          Inventories,
                                                          Defaults(Inventories),
                                                          {
                                                              Product: LookUp(PF_Products, ProductName = varProductName),
                                                              'Available Quantity': varOrderedQty,
                                                              'Date and Time': varOrderDate
                                                          }
                                                      )
                                                  );

                                                  // Step 4: Update order status
                                                  Patch(
                                                      DamangOrders,
                                                      varSelectedOrder,
                                                      {
                                                          'Order Status': 'Order Status'.Fulfilled
                                                      }
                                                  );

                                                  // Step 5: Show success message
                                                  Notify("Order fulfilled and inventory updated successfully", NotificationType.Success);Set(varOrderMode, "None");












